x-gmail-mcp-image: &gmail-mcp-image
  image: "${GMAIL_MCP_IMAGE:-gmail-mcp:local}"
  build:
    context: .
    dockerfile: Dockerfile

x-gmail-mcp-runtime: &gmail-mcp-runtime
  <<: *gmail-mcp-image
  depends_on:
    gmail-mcp-oauth-init:
      condition: service_completed_successfully
  init: true
  volumes:
    - mcp-gmail:/var/lib/gmail-mcp
    - gmail-mcp-config:/etc/gmail-mcp:ro
  stop_grace_period: 30s
  restart: unless-stopped

services:
  gmail-mcp-oauth-init:
    <<: *gmail-mcp-image
    user: "0:0"
    entrypoint: ["/bin/sh", "-ceu"]
    command:
      - |
        node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' /run/secrets/google-oauth.json
        install -m 0640 -o 0 -g 10001 /run/secrets/google-oauth.json /etc/gmail-mcp/.gcp-oauth.keys.json.new
        mv -f /etc/gmail-mcp/.gcp-oauth.keys.json.new /etc/gmail-mcp/gcp-oauth.keys.json
    volumes:
      - type: bind
        source: "${GMAIL_OAUTH_KEYS_PATH:?Set GMAIL_OAUTH_KEYS_PATH to an absolute OAuth JSON path}"
        target: /run/secrets/google-oauth.json
        read_only: true
      - gmail-mcp-config:/etc/gmail-mcp
    restart: "no"

  gmail-mcp:
    <<: *gmail-mcp-runtime
    command: ["--http", "--host=0.0.0.0", "--port=8080"]
    environment:
      GMAIL_MCP_PUBLIC_ORIGIN: "${GMAIL_MCP_PUBLIC_ORIGIN:?Set the externally reachable HTTPS origin}"
      GMAIL_MCP_BASE_PATH: "${GMAIL_MCP_BASE_PATH:-}"
      GMAIL_MCP_API_KEY: "${GMAIL_MCP_API_KEY:?Set a connector API key of at least 32 characters}"
      GMAIL_MCP_OAUTH_CALLBACKS: "${GMAIL_MCP_OAUTH_CALLBACKS:-https://claude.ai/api/mcp/auth_callback}"
    ports:
      - "${GMAIL_MCP_BIND_ADDRESS:-127.0.0.1}:${GMAIL_MCP_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  gmail-mcp-scheduler:
    <<: *gmail-mcp-runtime
    command: ["scheduler"]

volumes:
  mcp-gmail:
  gmail-mcp-config:

name: CI

on:
  push:
  pull_request:
    branches: [main, experimental]

permissions:
  contents: read
  issues: write

jobs:
  readme-check:
    name: README Updated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Check for skip flag
        id: skip
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # %B = full commit message (subject + body), so [skip-readme] is honored
          # wherever it appears — matching the CI error text and the README docs,
          # which both say "commit message" (not "subject line").
          COMMIT_MSG=$(git log -1 --format=%B)
          # Skip on explicit flag
          if echo "$COMMIT_MSG" | grep -qiE '\[(skip-readme|no-readme)\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif echo "$PR_TITLE" | grep -qiE '\[(skip-readme|no-readme)\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          # Skip on merge commits (experimental → main promotions already checked on experimental)
          elif echo "$COMMIT_MSG" | grep -qiE '^Merge branch'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check README updated (push)
        id: push_check
        if: github.event_name == 'push' && steps.skip.outputs.skip == 'false'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            DIFF_RANGE="HEAD~1..HEAD"
          else
            DIFF_RANGE="$BEFORE_SHA..HEAD"
          fi

          # Only require README update if source code was modified
          SRC_CHANGED=$(git diff --name-only $DIFF_RANGE | grep -c '^src/' || true)
          if [ "$SRC_CHANGED" -eq 0 ]; then
            echo "No source code changes — README check skipped."
            exit 0
          fi

          # Capture changed source files for the issue body
          SRC_FILES=$(git diff --name-only $DIFF_RANGE | grep '^src/' || true)
          echo "src_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SRC_FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          README_CHANGED=$(git diff --name-only $DIFF_RANGE | grep -c '^README\.md$' || true)
          if [ "$README_CHANGED" -eq 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "::error::Source code changed but README.md was not updated."
            echo ""
            echo "Every push with source changes should include a README.md update."
            echo "If this change genuinely doesn't need a docs update, add [skip-readme] or [no-readme] to your commit message."
            exit 1
          fi

      - name: Check README updated (PR)
        id: pr_check
        if: github.event_name == 'pull_request' && steps.skip.outputs.skip == 'false'
        run: |
          DIFF_RANGE="origin/${{ github.base_ref }}...HEAD"

          SRC_CHANGED=$(git diff --name-only $DIFF_RANGE | grep -c '^src/' || true)
          if [ "$SRC_CHANGED" -eq 0 ]; then
            echo "No source code changes — README check skipped."
            exit 0
          fi

          README_CHANGED=$(git diff --name-only $DIFF_RANGE | grep -c '^README\.md$' || true)
          if [ "$README_CHANGED" -eq 0 ]; then
            echo "::error::Source code changed but README.md was not updated in this PR."
            echo ""
            echo "Every PR with source changes should include a README.md update."
            echo "If this change genuinely doesn't need a docs update, add [skip-readme] or [no-readme] to your PR title."
            exit 1
          fi

      - name: README check passed
        if: steps.skip.outputs.skip == 'true'
        run: echo "README check skipped via commit message or PR title flag."

      - name: Create issue for README gap (push)
        if: failure() && steps.push_check.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          BRANCH="${{ github.ref_name }}"
          COMMIT_MSG=$(git log -1 --format=%s)
          SRC_FILES="${{ steps.push_check.outputs.src_files }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Ensure readme-gap label exists
          gh label create "readme-gap" --repo "${{ github.repository }}" \
            --description "README.md not updated alongside source changes" \
            --color "D93F0B" 2>/dev/null || true

          # Check for existing open issue to avoid duplicates
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --label "readme-gap" --state open --limit 1 --json number -q '.[0].number' || true)

          if [ -n "$EXISTING" ]; then
            # Append a comment to the existing issue instead of creating a new one
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "Another push with source changes but no README update:

          - **Commit:** [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${COMMIT_SHA}) — ${COMMIT_MSG}
          - **Branch:** \`${BRANCH}\`
          - **CI run:** ${RUN_URL}
          - **Files changed:**
          \`\`\`
          ${SRC_FILES}
          \`\`\`"
            echo "Appended to existing issue #${EXISTING}"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "README.md out of date — source changed without docs update (${SHORT_SHA})" \
              --label "readme-gap,documentation" \
              --body "## README gap detected by CI

          A push to \`${BRANCH}\` changed source code without updating README.md.

          - **Commit:** [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${COMMIT_SHA}) — ${COMMIT_MSG}
          - **Branch:** \`${BRANCH}\`
          - **CI run:** ${RUN_URL}
          - **Source files changed:**
          \`\`\`
          ${SRC_FILES}
          \`\`\`

          ### What to do
          1. Review the changed source files above
          2. Update README.md to reflect any user-facing changes
          3. Push the README update (this issue will be auto-closed when CI passes)

          *If this change genuinely needs no docs update, close this issue with a comment explaining why.*"
            echo "Created new README gap issue"
          fi

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint lockfile
        run: npm run lockfile:lint

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Test real stdio and authenticated HTTP processes
        run: npm run test:process

      - name: Install deployment test dependencies
        run: sudo apt-get update && sudo apt-get install -y age nginx shellcheck

      - name: Validate autonomous Ubuntu deployment bundle
        run: |
          shellcheck --severity=warning -x deploy/*.sh deploy/lib/*.sh deploy/bin/*.sh deploy/tests/*.sh
          bash deploy/verify.sh

      - name: Install and exercise an isolated clean release
        run: bash deploy/tests/clean-install.sh

      - name: Build the remote-server container
        run: docker build --tag gmail-mcp:ci .

      - name: Exercise container stdio, HTTP, OAuth callback, and Compose modes
        run: |
          set -Eeuo pipefail
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"docker-ci","version":"1"}}}' \
            | timeout 20 docker run --rm -i gmail-mcp:ci > /tmp/gmail-mcp-stdio.json
          grep -Fq '"name":"gmail"' /tmp/gmail-mcp-stdio.json

          http_container=$(docker run -d --rm \
            -p 127.0.0.1:19090:8080 \
            -e GMAIL_MCP_PUBLIC_ORIGIN=https://gmail.example.test \
            -e GMAIL_MCP_API_KEY=container-test-key-0123456789abcdef \
            -e GMAIL_MCP_OAUTH_CALLBACKS=https://claude.ai/api/mcp/auth_callback \
            gmail-mcp:ci --http --host=0.0.0.0 --port=8080)
          cleanup() {
            status=$?
            trap - EXIT
            if [[ "${status}" -ne 0 && "${compose_started:-0}" == 1 ]]; then
              printf 'Container exercise failed; Compose state and logs follow.\n' >&2
              docker compose ps --all >&2 || true
              docker compose logs --no-color >&2 || true
            fi
            if [[ "${compose_started:-0}" == 1 ]]; then
              docker compose down --volumes --remove-orphans >/dev/null 2>&1 || true
            fi
            docker rm -f "${http_container}" "${auth_container:-}" >/dev/null 2>&1 || true
            exit "${status}"
          }
          trap cleanup EXIT
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:19090/readyz && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:19090/readyz | grep -Fq '"status":"ready"'
          docker rm -f "${http_container}" >/dev/null

          mkdir -p /tmp/gmail-mcp-docker-auth
          printf '%s\n' '{"installed":{"client_id":"test.apps.googleusercontent.com","client_secret":"test","redirect_uris":["http://localhost:3000/oauth2callback"]}}' \
            > /tmp/gmail-mcp-docker-auth/gcp-oauth.keys.json
          auth_container=$(docker run -d --rm \
            -p 127.0.0.1:19091:3000 \
            -e GMAIL_OAUTH_LISTEN_HOST=0.0.0.0 \
            --mount type=bind,source=/tmp/gmail-mcp-docker-auth/gcp-oauth.keys.json,target=/etc/gmail-mcp/gcp-oauth.keys.json,readonly \
            gmail-mcp:ci auth)
          for _ in $(seq 1 50); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:19091/not-found || true)
            [[ "${code}" == 404 ]] && break
            sleep 0.2
          done
          [[ "${code}" == 404 ]]
          docker rm -f "${auth_container}" >/dev/null

          export COMPOSE_PROJECT_NAME=gmail-mcp-ci
          export GMAIL_MCP_IMAGE=gmail-mcp:ci
          export GMAIL_OAUTH_KEYS_PATH=/tmp/gmail-mcp-docker-auth/gcp-oauth.keys.json
          export GMAIL_MCP_PUBLIC_ORIGIN=https://gmail.example.test
          export GMAIL_MCP_API_KEY=compose-test-key-0123456789abcdef
          export GMAIL_MCP_HTTP_PORT=19092
          docker compose config >/tmp/gmail-mcp-compose.yml
          docker compose config --format json >/tmp/gmail-mcp-compose.json
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const config = JSON.parse(fs.readFileSync('/tmp/gmail-mcp-compose.json', 'utf8'));
          const http = config.services['gmail-mcp'];
          const scheduler = config.services['gmail-mcp-scheduler'];
          assert.deepEqual(http.command, ['--http', '--host=0.0.0.0', '--port=8080']);
          assert.deepEqual(scheduler.command, ['scheduler']);
          assert.equal(http.healthcheck.test[0], 'CMD');
          assert.equal(http.restart, 'unless-stopped');
          assert.equal(scheduler.restart, 'unless-stopped');
          assert.equal(scheduler.init, true);
          assert.equal(
            scheduler.depends_on['gmail-mcp-oauth-init'].condition,
            'service_completed_successfully',
          );
          const targets = service => service.volumes.map(volume => volume.target).sort();
          assert.deepEqual(targets(scheduler), targets(http));
          assert.deepEqual(targets(scheduler), ['/etc/gmail-mcp', '/var/lib/gmail-mcp']);
          NODE
          compose_started=1
          docker compose up --detach --no-build
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:19092/readyz && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:19092/readyz | grep -Fq '"status":"ready"'
          set -x
          http_id=$(docker compose ps -q gmail-mcp)
          scheduler_id=$(docker compose ps -q gmail-mcp-scheduler)
          [[ -n "${http_id}" && -n "${scheduler_id}" ]]
          [[ "$(docker inspect --format '{{.State.Running}}' "${scheduler_id}")" == true ]]
          [[ "$(docker inspect --format '{{json .Config.Cmd}}' "${http_id}")" == '["--http","--host=0.0.0.0","--port=8080"]' ]]
          [[ "$(docker inspect --format '{{json .Config.Cmd}}' "${scheduler_id}")" == '["scheduler"]' ]]
          [[ "$(docker compose ps -q gmail-mcp-scheduler | sed '/^$/d' | wc -l)" -eq 1 ]]
          docker compose exec -T gmail-mcp sh -ceu '
            test -w /var/lib/gmail-mcp
            test "$(stat -c "%a:%u:%g" /etc/gmail-mcp/gcp-oauth.keys.json)" = "640:0:10001"
            grep -Fq test.apps.googleusercontent.com /etc/gmail-mcp/gcp-oauth.keys.json
            touch /var/lib/gmail-mcp/.http-volume-check
          '
          docker compose exec -T gmail-mcp-scheduler sh -ceu '
            test -w /var/lib/gmail-mcp
            test -r /etc/gmail-mcp/gcp-oauth.keys.json
            test -f /var/lib/gmail-mcp/.http-volume-check
            count=0
            for process in /proc/[0-9]*; do
              if [ "$(cat "${process}/comm" 2>/dev/null || true)" = node ]; then
                command=$(tr "\000" " " <"${process}/cmdline" 2>/dev/null || true)
                [ "${command}" = "node dist/index.js scheduler " ] && count=$((count + 1))
              fi
            done
            test "${count}" -eq 1
          '
          docker compose logs --no-color gmail-mcp-scheduler | grep -Fq 'Starting Gmail MCP Scheduler Daemon'
          set +x
          docker compose down --volumes --remove-orphans
          compose_started=0

name: Close stale PR #5

# Runs daily at 06:00 UTC; acts on/after 2026-11-04 (8 months from PR creation,
# per maintainer staleness policy for help-wanted PRs).
# Self-disables by deleting itself after closing the PR or if the PR is already closed.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write   # needed to delete the workflow file via API
  pull-requests: write

jobs:
  check-and-close:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR #5 and close if stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          PR_NUMBER=5
          OWNER_LOGIN="ArtyMcLabin"
          DEADLINE="2026-11-04T00:00:00Z"
          CUTOFF="2026-07-10T00:00:00Z"

          echo "::group::Fetching PR state"
          PR_STATE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state -q '.state')
          echo "PR state: $PR_STATE"
          echo "::endgroup::"

          # If PR is already closed/merged, clean up this workflow
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is already $PR_STATE. Cleaning up workflow."
            gh api -X DELETE "repos/$REPO/contents/.github/workflows/close-stale-pr-5.yml" \
              -f message="ci: remove stale PR #5 closer (PR already $PR_STATE)" \
              -f branch="${{ github.ref_name }}" \
              -f sha="$(gh api "repos/$REPO/contents/.github/workflows/close-stale-pr-5.yml" -q '.sha')" \
              || echo "Warning: could not auto-delete workflow file"
            exit 0
          fi

          # Check if we've reached the deadline
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [[ "$NOW" < "$DEADLINE" ]]; then
            echo "Deadline not reached yet (now=$NOW, deadline=$DEADLINE). Skipping."
            exit 0
          fi

          echo "::group::Checking for community participation since $CUTOFF"
          # Any non-owner comment after the cutoff counts as community participation
          HAS_PARTICIPATION=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --paginate \
            -q "[.[] | select(.user.login != \"$OWNER_LOGIN\" and .created_at > \"$CUTOFF\")] | length")
          echo "Non-owner comments after $CUTOFF: $HAS_PARTICIPATION"
          echo "::endgroup::"

          if [ "$HAS_PARTICIPATION" -gt 0 ]; then
            echo "Community participation detected since $CUTOFF. PR stays open for manual review."
            exit 0
          fi

          # Close the PR with a comment
          echo "No community participation since $CUTOFF. Closing PR."
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "Closing as stale per the 8-month help-wanted policy — no community tester volunteered. The implementation may still be useful: feel free to reopen if someone can test it. Meanwhile, multi-account works today by registering the server once per account with separate credential dirs, and the maximalist fork klodr/gmail-mcp may also fit."

          gh pr close "$PR_NUMBER" --repo "$REPO"

          echo "PR #$PR_NUMBER closed."

          # Clean up: delete this workflow file since it's no longer needed
          gh api -X DELETE "repos/$REPO/contents/.github/workflows/close-stale-pr-5.yml" \
            -f message="ci: remove stale PR #5 closer (PR closed)" \
            -f branch="${{ github.ref_name }}" \
            -f sha="$(gh api "repos/$REPO/contents/.github/workflows/close-stale-pr-5.yml" -q '.sha')" \
            || echo "Warning: could not auto-delete workflow file. Remove manually."
